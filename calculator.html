<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        #box{
            height: 700px;
            width: 400px;
            border-radius: 20px;
            background-color: navy;
            gap: 15px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 150px repeat(6, 1fr);
        }
        body{
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: center;
        }
        #sol{
            width: 100%;
            font-size: 2rem;
            height: 150px;
            color: navy;
            text-align: right;
            background-color: lightgrey;
            border-radius: 10px;
            grid-area: 1 / 1 / 2 / 5;
        }
        .num{
            border-radius: 10px;
            background-color: lightgrey;
            font-size: 3rem;
            text-align: center;
            cursor: pointer;
            color: navy;
        }
        *{
            font-family: Comic Sans MS;
        }
    </style>
</head>
<body>
    <h1 style="color: navy;font-size: 2.5rem;">CALCULATOR</h1>
    <div id="box">
        <div id="sol"></div>
        <div class="num" onclick="append(this.innerText)">7</div>
        <div class="num" onclick="append(this.innerText)">8</div>
        <div class="num" onclick="append(this.innerText)">9</div>
        <div class="num" onclick="append(this.innerText)">+</div>
        <div class="num" onclick="append(this.innerText)">4</div>
        <div class="num" onclick="append(this.innerText)">5</div>
        <div class="num" onclick="append(this.innerText)">6</div>
        <div class="num" onclick="append(this.innerText)">-</div>
        <div class="num" onclick="append(this.innerText)">1</div>
        <div class="num" onclick="append(this.innerText)">2</div>
        <div class="num" onclick="append(this.innerText)">3</div>
        <div class="num" onclick="append(this.innerText)">/</div>
        <div class="num" onclick="append(this.innerText)">0</div>
        <div class="num" onclick="append(this.innerText)">.</div>
        <div class="num" onclick="append(this.innerText)">x</div>
        <div class="num" onclick="append(this.innerText)">%</div>
        <div class="num" onclick="append(this.innerText)">sin</div>
        <div class="num" onclick="append(this.innerText)">cos</div>
        <div class="num" onclick="append(this.innerText)">tan</div>
        <div class="num" onclick="cal()">=</div>
        <div class="num" onclick="append(this.innerText)">x<sup>y</sup></div>
        <div class="num" onclick="append(this.innerText)">log<sub>10</sub></div>
        <div class="num" onclick="append(this.innerText)">&radic;</div>
        <div class="num" onclick="clr()">C</div>
    </div>
    <script>
        let d = document.querySelector("#sol");
        let seq=[];
        function append(i){
            d.innerText+=i;
            if(i=='+'){
                
            }
            else{
                seq.push(i);
            }
        }
        function clr(){
            d.innerText="";
            seq=[];
        }
    </script>
</body>
</html>
